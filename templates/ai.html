<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0E1013">
  <title>AYO AI — AYO! Where's My Bus?</title>
  <link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/ai.css">
  <script src="/static/js/transit-ui.js" defer></script>
  <script src="/static/js/assistant.js" defer></script>
  <script src="/static/js/ai-chat.js" defer></script>
</head>
<body class="ai-page">
  <a class="skip-link" href="#main">Skip to AYO AI</a>
  <header class="app-header"><a class="brand" href="/#stops" aria-label="AYO home">AYO!</a><div class="ai-header-actions"><button id="aiLanguage" type="button" aria-label="Switch language">ES</button><button id="newChat" type="button">New Chat</button></div></header>
  <main id="main" tabindex="-1">
    <section class="ai-chat" aria-labelledby="aiTitle">
      <div class="ai-heading"><h1 id="aiTitle">AYO AI</h1><p id="aiSubtitle">Your Milwaukee transit assistant</p></div>
      <div id="aiConversation" class="ai-conversation" role="log" aria-label="Conversation" aria-live="polite" tabindex="0"></div>
      <div id="aiSuggestions" class="ai-suggestions"></div>
      <p id="aiTyping" class="ai-typing" role="status"></p>
      <form id="aiForm" class="ai-composer">
        <label for="aiMessage" id="aiMessageLabel">Message AYO AI</label>
        <div class="ai-compose-row"><textarea id="aiMessage" rows="2" maxlength="1000" required aria-describedby="aiDisclosure"></textarea><button id="aiSend" type="submit">Send</button></div>
      </form>
      <p id="aiDisclosure" class="ai-disclosure">Rule-based guidance and verified transit tools. No general-purpose AI model.</p>
    </section>
  </main>
  <nav class="app-nav" aria-label="Main navigation">
    <a href="/#stops" data-ai-nav="stops"><span>Stops</span></a><a href="/#trip" data-ai-nav="trip"><span>Trip</span></a><a href="/ai" aria-current="page"><span>AYO AI</span></a><a href="/#alerts" data-ai-nav="alerts"><span>Alerts</span></a><a href="/#saved" data-ai-nav="saved"><span>Saved</span></a>
  </nav>
</body>
</html>
